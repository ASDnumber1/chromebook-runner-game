<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics Runner</title>
  <style>
    :root {
      --sky-top: #7ec8ff;
      --sky-bottom: #dff4ff;
      --ground: #4e9c3d;
      --ground-deep: #2e6b2f;
      --platform: #66bb6a;
      --platform-deep: #2e7d32;
      --panel-bg: rgba(17, 25, 40, 0.92);
      --button-green: #4caf50;
      --button-green-hover: #3b8c3d;
      --button-orange: #ff9800;
      --button-orange-hover: #e68900;
      --warning: #ffd166;
      --text: #ffffff;
      --dark: #0b1020;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111827;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(var(--sky-top), var(--sky-bottom));
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    }

    #hud {
      position: absolute;
      top: 14px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 10;
      pointer-events: none;
    }

    .hudBox {
      background: rgba(11, 16, 32, 0.72);
      border: 2px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 10px 15px;
      font-size: clamp(16px, 2vw, 24px);
      font-weight: bold;
    }

    #startScreen,
    #quizScreen,
    #gameOverScreen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      z-index: 20;
    }

    .hidden {
      display: none !important;
    }

    .panel {
      width: min(90vw, 720px);
      background: var(--panel-bg);
      border: 3px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.45);
    }

    h1, h2 {
      margin: 0 0 18px;
      color: var(--warning);
      letter-spacing: 1px;
    }

    h1 {
      font-size: clamp(34px, 5vw, 64px);
    }

    h2 {
      font-size: clamp(28px, 4vw, 44px);
    }

    p {
      margin: 12px 0;
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.5;
    }

    .buttonRow {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 26px;
      font-size: clamp(18px, 2vw, 24px);
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    #startNormalButton {
      background: var(--button-green);
    }

    #startNormalButton:hover {
      background: var(--button-green-hover);
    }

    #startHardButton {
      background: var(--button-orange);
    }

    #startHardButton:hover {
      background: var(--button-orange-hover);
    }

    #quizScreen {
      background: rgba(0,0,0,0.82);
    }

    .quizPanel {
      width: min(92vw, 760px);
      background: rgba(21, 27, 38, 0.95);
      border: 3px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 28px 22px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    #quizQuestion {
      font-size: clamp(22px, 2.8vw, 34px);
      color: var(--warning);
      font-weight: bold;
      margin-bottom: 20px;
    }

    #choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .choice {
      width: 100%;
      background: #1e293b;
      color: white;
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 16px 18px;
      text-align: left;
      font-size: clamp(17px, 2vw, 22px);
      margin-top: 0;
    }

    .choice.selected {
      background: #3b82f6;
      border-color: #93c5fd;
    }

    .choice.correct {
      background: #16a34a;
      border-color: #86efac;
    }

    .choice.incorrect {
      background: #dc2626;
      border-color: #fca5a5;
    }

    #quizFeedback {
      min-height: 52px;
      margin-top: 18px;
      font-size: clamp(18px, 2vw, 22px);
      font-weight: bold;
      color: #fef3c7;
    }

    #quizAnswerButton {
      margin-top: 12px;
      background: var(--button-green);
    }

    #quizAnswerButton:hover {
      background: var(--button-green-hover);
    }

    #quizAnswerButton:disabled {
      background: #666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="hud">
      <div id="scoreBox" class="hudBox">Score: 0</div>
      <div id="timeBox" class="hudBox">Time: 0s</div>
    </div>

    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div id="startScreen">
      <div class="panel">
        <h1>Physics Runner</h1>
        <p>Run, jump, dodge monsters, and answer physics questions when a monster catches you.</p>
        <p>Focus on Force, Friction, Inertia, Speed, Velocity, and Acceleration.</p>
        <div class="buttonRow">
          <button id="startNormalButton">Start Normal</button>
          <button id="startHardButton">Start Hard</button>
        </div>
      </div>
    </div>

    <div id="quizScreen" class="hidden">
      <div class="quizPanel">
        <div id="quizQuestion"></div>
        <div id="choices"></div>
        <div id="quizFeedback"></div>
        <button id="quizAnswerButton">Submit Answer</button>
      </div>
    </div>

    <div id="gameOverScreen" class="hidden">
      <div class="panel">
        <h2>Game Over</h2>
        <p id="finalScoreText">Final Score: 0</p>
        <button id="restartButton">Play Again</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
